[package]
name = "scion-client"
description = "Official Rust SDK for Scion (depends only on the public protocol)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
hex.workspace = true
scion-object.workspace = true
scion-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-types.workspace = true
uuid = { version = "1", features = ["v7"] }
tower = { workspace = true, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
# 只有测试可以在进程内拉起服务端（客户端文档 §0）
scion-api.workspace = true
scion-store.workspace = true
scion-cache.workspace = true
scion-auth = { workspace = true, features = ["testing"] }
tokio.workspace = true

[lints]
workspace = true
