# 本地开发依赖：MinIO（S3 兼容对象存储）与 PostgreSQL（Standard 档元数据库）。
# M0 的 scion server 只用内存存储；这些服务供 M1 起的 SQL / S3 后端开发和集成测试使用。
#
#   docker compose -f deploy/dev/docker-compose.yml up -d
name: scion-dev

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: scion
      MINIO_ROOT_PASSWORD: scion-dev-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 scion scion-dev-secret &&
      mc mb --ignore-existing local/scion-objects
      "

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion-dev-secret
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion"]
      interval: 5s
      retries: 20

volumes:
  minio-data:
  pg-data:
