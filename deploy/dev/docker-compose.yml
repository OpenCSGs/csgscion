# 本地开发依赖：S3 兼容对象存储（SeaweedFS）与 PostgreSQL（Standard 档元数据库）。
#
#   docker compose -f deploy/dev/docker-compose.yml up -d
#
# 拉不到 Docker Hub 时，可以把镜像名换成镜像站地址，例如
#   docker.m.daocloud.io/chrislusf/seaweedfs:4.48、docker.m.daocloud.io/library/postgres:16
#
# 为什么不用 MinIO：MinIO 开源版已归档、停止维护，官方不再提供社区版下载。
# Scion 只用 S3 核心子集，对 MinIO 的兼容性不受影响（接入 starhub 时可直接使用其现有 MinIO）。
name: scion-dev

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API：endpoint http://localhost:8333，access key scion / scion-dev-secret
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 's3.bucket.list' | weed shell >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name scion-objects' | weed shell -master=s3:9333"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion-dev-secret
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion"]
      interval: 5s
      retries: 20

volumes:
  s3-data:
  pg-data:
